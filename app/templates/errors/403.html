{% extends "base.html" %}

{% block title %}Access Denied - 403{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; color: var(--arch-danger);">403</h1>
    <h2 style="margin: 0.5rem 0;">Access Restricted</h2>
    <p style="color: var(--arch-text-muted); margin-bottom: 1.5rem;">You do not possess the necessary role permissions to access this confidential operational area.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
