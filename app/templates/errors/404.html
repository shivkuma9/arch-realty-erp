{% extends "base.html" %}

{% block title %}Not Found - 404{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; color: var(--arch-blue-primary);">404</h1>
    <h2 style="margin: 0.5rem 0;">Record Not Found</h2>
    <p style="color: var(--arch-text-muted); margin-bottom: 1.5rem;">The requested lead, property, or record could not be located in ARCH Realty repository.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
